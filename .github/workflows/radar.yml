name: job-radar

on:
  schedule:
    # Crawl every hour at :17 (GitHub can start a few minutes late). New postings are caught within ~1 h.
    # WHEN emails go out is set in config.yaml → notify (IST digests + instant P1 alerts), not here.
    - cron: "17 * * * *"
  workflow_dispatch: {}        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl, score, notify
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m radar.main
      - name: Commit updated data (feeds the dashboard)
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
